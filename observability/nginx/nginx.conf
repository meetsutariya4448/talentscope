# Front proxy for the readiness-gating demonstration.
#
# The point: prove that a cold api replica does not receive search traffic.
# On compose there is no orchestrator reading /ready and editing an endpoint
# list, so this does that job — two named api backends, passive health
# checking, and retry-on-503 so a client never sees the cold replica at all.

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    upstream talentscope_api {
        # Named backends rather than `--scale api=2`: nginx OSS resolves an
        # upstream hostname exactly once, at startup, so a single `server
        # api:8000` against compose's round-robin DNS would pin itself to
        # whichever replica it resolved first and never see the other.
        #
        # max_fails=1 fail_timeout=10s: one failed attempt takes a backend out
        # of rotation for 10s. Combined with proxy_next_upstream below, the
        # 503 a warming replica returns from /postings/?mode=vector ejects it
        # and the request is retried against the warm one.
        server api:8000  max_fails=1 fail_timeout=10s;
        server api2:8000 max_fails=1 fail_timeout=10s;
    }

    # http_503 is the load-bearing entry. The api returns 503 + Retry-After
    # from the vector/hybrid search paths while its model is still warming
    # (app/api/guards.py), and that is precisely the response that should
    # cause a retry elsewhere rather than reach the caller.
    proxy_next_upstream          error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries    2;
    proxy_next_upstream_timeout  10s;

    proxy_connect_timeout 2s;
    proxy_read_timeout    30s;

    server {
        listen 80;

        location / {
            proxy_pass http://talentscope_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            # The api's per-IP Q&A rate limit (app/search/budget.py) reads the
            # client address; without this every request would arrive wearing
            # nginx's container IP and share one bucket.
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy-local liveness, so `docker compose ps` can tell nginx being
        # down apart from both backends being down.
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }
    }
}
