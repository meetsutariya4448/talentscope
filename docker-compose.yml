services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: talentscope
      POSTGRES_PASSWORD: talentscope
      POSTGRES_DB: talentscope
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host port is overridable because a developer machine very often
      # already has a local Postgres on 5432 (and Redis on 6379) — the
      # collision documented in docs/observability.md. Container-side ports
      # are fixed: service-to-service traffic inside the compose network
      # always uses postgres:5432 / redis:6379 regardless of these.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentscope"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    env_file: .env
    environment:
      # .env's DATABASE_URL/REDIS_URL default to localhost for local
      # (non-Docker) dev — inside this container "localhost" is the
      # container itself, not the postgres/redis services. These override
      # env_file's values (compose's environment: takes precedence).
      DATABASE_URL: postgresql://talentscope:talentscope@postgres:5432/talentscope
      REDIS_URL: redis://redis:6379/0
    # Gates on /ready, not /health: /health is 200 the instant uvicorn binds,
    # which is exactly the "up but cannot serve a search yet" window this
    # healthcheck exists to keep `docker compose up --wait` out of. start_period
    # covers the embedding-model warmup without counting those attempts as
    # failures.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready', timeout=3).status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  worker:
    build: .
    # Explicit -Q: task_routes (app/tasks/celery_app.py) sends tasks to
    # named queues, and a worker only consumes queues it's told to listen
    # on — without this flag, everything but the implicit default queue
    # would sit undelivered.
    # Clear stale multiprocess metric files before starting — the volume
    # persists across restarts, but files left by a previous (now-dead)
    # process's pid would otherwise be double-counted by MultiProcessCollector.
    # One line on purpose. A YAML folded scalar (>) does not fold a
    # continuation line that is indented further than the first — it keeps the
    # newline. That survives here only because the break falls right after
    # `&&`, where the shell treats it as a line continuation. Break it anywhere
    # else and `sh -c` silently receives two commands, dropping every flag
    # after the break (this cost a whole benchmark cell on 2026-09-06, when a
    # dropped --concurrency sent Celery back to its os.cpu_count() default).
    command: sh -c "rm -rf /tmp/prometheus_multiproc/* && celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4 -Q ingestion,embedding,maintenance"
    env_file: .env
    environment:
      # See api service's comment — env_file's localhost-based URLs don't
      # resolve to the postgres/redis services from inside a container.
      DATABASE_URL: postgresql://talentscope:talentscope@postgres:5432/talentscope
      REDIS_URL: redis://redis:6379/0
      # Aggregates Counter/Histogram/Gauge writes across the prefork pool's
      # forked children — see app/observability.py's module docstring.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
    ports:
      - "9808:9808"   # worker Prometheus /metrics — separate process/port from the api's
    # task_acks_late + worker_prefetch_multiplier=1 mean an in-flight task
    # survives a hard kill (redelivered to another worker), but a *graceful*
    # SIGTERM (docker stop, k8s pod termination) should let it finish first.
    # Celery's warm shutdown waits for running tasks up to this grace period
    # before the container is SIGKILLed.
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      # The hf_cache volume that used to sit at /root/.cache/huggingface is
      # gone: the model is baked into the image (see Dockerfile) and
      # HF_HUB_OFFLINE=1 forbids the download it existed to avoid repeating.
      # /root is also unwritable now the container runs as a non-root user.
      - prometheus_multiproc:/tmp/prometheus_multiproc

  beat:
    build: .
    # --schedule puts the PersistentScheduler shelve file on its own volume.
    # It previously defaulted to ./celerybeat-schedule inside the bind-mounted
    # source tree — which the non-root container user cannot write to, and
    # which is why celerybeat-schedule* keep turning up at the repo root.
    command: >
      celery -A app.tasks.celery_app beat --loglevel=info
      --scheduler celery.beat:PersistentScheduler
      --schedule /var/lib/celery/celerybeat-schedule
    env_file: .env
    environment:
      DATABASE_URL: postgresql://talentscope:talentscope@postgres:5432/talentscope
      REDIS_URL: redis://redis:6379/0
    stop_grace_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - beat_schedule:/var/lib/celery

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
      - worker

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # Container-level CPU/memory for every service, generically — the
  # standard source for these (rather than hand-rolling per-process
  # psutil gauges) and the same component Kubernetes' kubelet bundles
  # for node/pod metrics, so this doubles as a preview of the Phase 4
  # metrics story.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    ports:
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    privileged: true

volumes:
  postgres_data:
  prometheus_data:
  prometheus_multiproc:
  grafana_data:
  beat_schedule:
