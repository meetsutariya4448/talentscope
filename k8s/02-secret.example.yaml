# Template only — never commit a real Secret manifest. k8s/apply.sh generates
# the actual Secret from .env via `kubectl create secret generic --from-literal`
# (or, for a real cluster, this is exactly where an External Secrets Operator
# pulling from AWS Secrets Manager / Vault would sit instead — see the
# Terraform phase for the AWS-side half of that).
apiVersion: v1
kind: Secret
metadata:
  name: talentscope-secrets
  namespace: talentscope
type: Opaque
stringData:
  GROQ_API_KEY: "your_groq_api_key_here"
  ADZUNA_APP_ID: ""
  ADZUNA_APP_KEY: ""
  POSTGRES_PASSWORD: "talentscope"
