apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: talentscope
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: talentscope:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: talentscope-config }
            - secretRef: { name: talentscope-secrets }
