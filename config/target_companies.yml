# Posting-panel target company list — the human-editable source of truth,
# synced into `monitored_companies` on every worker/beat startup
# (app.ingestion.company_registry.sync_monitored_companies).
#
# Grow this toward the project's 200-400 company target incrementally. Before
# adding a token, verify it actually returns postings, e.g.:
#   curl -s https://api.ashbyhq.com/posting-api/job-board/<token> | python3 -c \
#     "import sys,json; print(len(json.load(sys.stdin).get('jobs', [])))"
# A bad token doesn't error loudly — it just shows up as a permanent
# 'http_error' or 'empty' in collection_run_companies and pollutes the health
# check, so don't take one on faith.

